<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Tiger — Clone Social</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="game-wrapper">
        
        <!-- BARRA DE TOPO -->
        <header class="game-header">
            <div class="back-btn"><i class="fa-solid fa-house"></i></div>
            <div class="game-title">FORTUNE TIGER</div>
            <div class="demo-badge">DEMO</div>
        </header>

        <!-- TELA DO TIGRINHO (ESTILO APP) -->
        <main class="tiger-screen">
            
            <!-- Personagem do Tigrinho Animado -->
            <div class="tiger-character-box">
                <div id="tiger-emoji" class="tiger-avatar">🐯</div>
                <div id="bubble-speech" class="speech-bubble">Solte o Tigre! ⚡</div>
            </div>

            <!-- Moldura de Ouro do Slot (Grade 3x3 igual ao real) -->
            <div class="slot-gold-frame">
                <div class="slot-grid">
                    <!-- Linha 1 -->
                    <div class="slot-cell" id="c00">🍊</div>
                    <div class="slot-cell" id="c01">🧧</div>
                    <div class="slot-cell" id="c02">🪙</div>
                    <!-- Linha 2 -->
                    <div class="slot-cell" id="c10">💎</div>
                    <div class="slot-cell" id="c11">🐯</div>
                    <div class="slot-cell" id="c12">🍊</div>
                    <!-- Linha 3 -->
                    <div class="slot-cell" id="c20">🪙</div>
                    <div class="slot-cell" id="c21">💎</div>
                    <div class="slot-cell" id="c22">🧧</div>
                </div>
            </div>

            <!-- Placar de Status de Vitória -->
            <div class="win-display">
                <span id="status-text">FAÇA SEU GIRO!</span>
            </div>

        </main>

        <!-- CONTROLES E BOTÕES DE APOSTA -->
        <section class="control-footer">
            
            <!-- Linha de Saldo e Informações -->
            <div class="info-bar">
                <div class="info-box">
                    <span class="info-label">SALDO</span>
                    <span class="info-value text-green">R$ <span id="balance-display">1000.00</span></span>
                </div>
                <div class="info-box">
                    <span class="info-label">GANHO</span>
                    <span class="info-value text-gold">R$ <span id="win-display-val">0.00</span></span>
                </div>
            </div>

            <!-- Painel de Disparo e Ajuste -->
            <div class="action-panel">
                <div class="bet-selector">
                    <button class="bet-btn" onclick="changeBet(-2)">-</button>
                    <div class="bet-number">
                        <span class="bet-label">APOSTA</span>
                        <span class="bet-amount">R$ <span id="bet-display">10.00</span></span>
                    </div>
                    <button class="bet-btn" onclick="changeBet(2)">+</button>
                </div>

                <!-- Botão de Girar Grande e Laranja -->
                <button id="spin-button" class="spin-trigger" onclick="triggerSpin()">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
